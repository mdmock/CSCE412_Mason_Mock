<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal — Forward Curve</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="masthead">
  <div class="wrap">
    <a class="brand" href="http://localhost:9081/">
      <img src="logo.png" alt="Forward Curve logo" class="brand-mark">
      <span class="brand-name">Forward Curve<span class="sub">ENERGY ADVISORY</span></span>
    </a>
    <nav class="tools" aria-label="Product suite">
      <a href="http://localhost:9081/">Home</a>
      <a href="http://localhost:9082/">Curve</a>
      <a href="http://localhost:9083/">Ledger</a>
      <a href="http://localhost:9084/" aria-current="page">Portal</a>
      <a href="http://localhost:9085/">Field Notes</a>
    </nav>
  </div>
</header>

<main>
  <div class="wrap">
    <h2 class="section-title" style="margin-top:44px;">Client portal</h2>
    <p class="section-sub">Sign in to review deliverables, message your advisory team, and approve engagement milestones.</p>

    <form class="panel" onsubmit="event.preventDefault(); alert('This is a static demo — no account system is connected.');">
      <label for="email">Work email</label>
      <input id="email" type="email" placeholder="you@company.com" required>
      <label for="password">Password</label>
      <input id="password" type="password" placeholder="••••••••" required>
      <button type="submit">Sign in</button>
      <p class="panel-note">Demo interface — form does not connect to a live account system.</p>
    </form>
  </div>
</main>

<footer>
  <div class="wrap">
    <span>Forward Curve Energy Advisory</span>
    <span>Portal — client access</span>
  </div>
</footer>
</body>
</html>
